name: repodoctor-gateway

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/repodoctor/repodoctor-gateway

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Repodoctor/repodoctor-contracts
          path: ../repodoctor-contracts
          token: ${{ secrets.REPODOCTOR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install contracts
        working-directory: ../repodoctor-contracts
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Repodoctor/repodoctor-contracts
          path: ../repodoctor-contracts
          token: ${{ secrets.REPODOCTOR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble image context
        run: |
          mkdir -p /tmp/docker-ctx/service /tmp/docker-ctx/contracts
          cp -a . /tmp/docker-ctx/service
          cp -a ../repodoctor-contracts /tmp/docker-ctx/contracts
      - name: Build
        run: |
          SHA_TAG="${{ github.sha }}"
          docker build -f Dockerfile -t "$IMAGE:$SHA_TAG" /tmp/docker-ctx
      - name: Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
      - name: Push immutable tags
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          fi
